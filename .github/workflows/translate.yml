name: Auto-translate issues and comments

# Non-English text  -> English translation
# English text      -> German translation

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened]
# Review comments, thread replies and review summaries are handled by
# translate-reviews.yml (scheduled), since GitHub doesn't reliably trigger
# workflows for them on PRs that target non-default branches.

permissions:
  issues: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Translate
        uses: actions/github-script@v7
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          # Comma-separated GitHub usernames whose text is always treated as German
          GERMAN_USERS: ${{ vars.GERMAN_USERS }}
        with:
          script: |
            const MARKER = '<!-- auto-translation -->';
            const p = context.payload;

            // Pull body, author and issue/PR number out of whichever event fired
            let body, user, number;
            switch (context.eventName) {
              case 'issues':
                body = p.issue.body; user = p.issue.user; number = p.issue.number; break;
              case 'issue_comment':
                body = p.comment.body; user = p.comment.user; number = p.issue.number; break;
              case 'pull_request_target':
                body = p.pull_request.body; user = p.pull_request.user; number = p.pull_request.number; break;
              default:
                return;
            }

            // Comments sent by email reply carry the quoted thread and GitHub's footer.
            // Keep only what the person actually wrote.
            function stripEmailReply(text) {
              if (!text) return '';
              let cut = text.length;
              const markers = [
                /^Am .{0,150}?\d{1,2}:\d{2}.{0,60}?schrieb/ms,   // German attribution line
                /^On .{0,150}?\d{1,2}:\d{2}.{0,150}?wrote:/ms,   // English attribution line
              ];
              for (const re of markers) {
                const m = text.match(re);
                if (m && m.index < cut) cut = m.index;
              }
              // Footer: a lone em dash line followed by GitHub notification links
              const dash = text.match(/^—\s*$/m);
              if (dash && text.slice(dash.index).includes('github.com/notifications') && dash.index < cut) {
                cut = dash.index;
              }
              return text.slice(0, cut).replace(/^>.*$/gm, '').trim();
            }

            body = stripEmailReply(body);

            // Don't translate bots or our own translations (prevents loops)
            if (!body || user.type === 'Bot' || body.includes(MARKER)) return;

            // Protect fenced code blocks from translation
            const blocks = [];
            const prepared = body.replace(/```[\s\S]*?```/g, (m) => {
              blocks.push(m);
              return `CODEBLOCK${blocks.length - 1}X`;
            });
            if (!prepared.replace(/CODEBLOCK\d+X/g, '').trim()) return;

            const key = process.env.DEEPL_API_KEY;
            const host = key.endsWith(':fx') ? 'api-free.deepl.com' : 'api.deepl.com';

            async function deepl(text, target, source) {
              const res = await fetch(`https://${host}/v2/translate`, {
                method: 'POST',
                headers: {
                  'Authorization': `DeepL-Auth-Key ${key}`,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(
                  source
                    ? { text: [text], target_lang: target, source_lang: source }
                    : { text: [text], target_lang: target }
                ),
              });
              if (!res.ok) throw new Error(`DeepL error ${res.status}: ${await res.text()}`);
              const t = (await res.json()).translations[0];
              return {
                detected: t.detected_source_language,
                text: t.text.replace(/CODEBLOCK(\d+)X/g, (_, i) => blocks[i] ?? ''),
              };
            }

            // Word overlap between two texts, 0 to 1. A real translation shares few words
            // with its source; text that was already in the target language shares most.
            function similarity(a, b) {
              const words = (s) => new Set(s.toLowerCase().match(/[\p{L}\p{N}]+/gu) || []);
              const A = words(a), B = words(b);
              if (!A.size || !B.size) return 1;
              let shared = 0;
              for (const w of A) if (B.has(w)) shared++;
              return shared / (A.size + B.size - shared);
            }

            // Listed German speakers skip auto-detection: always German -> English
            const germanUsers = (process.env.GERMAN_USERS || '')
              .split(',').map((s) => s.trim().toLowerCase()).filter(Boolean);
            const isGerman = germanUsers.includes(user.login.toLowerCase());

            // Step 1: translate to English (forcing German as source for listed users)
            const en = isGerman
              ? await deepl(prepared, 'EN-US', 'DE')
              : await deepl(prepared, 'EN-US');
            const detected = isGerman ? 'DE' : en.detected;
            core.info(`author=${user.login} forcedGerman=${isGerman} detected=${en.detected}`);

            let label, translated;
            if (detected !== 'EN') {
              // Barely changed: it was already English (e.g. a German speaker writing in English)
              if (similarity(en.text, body) >= 0.5) return;
              label = `English (translated from ${detected})`;
              translated = en.text;
            } else {
              // Step 2: it was already English, so translate to German
              const de = await deepl(prepared, 'DE');
              label = 'Deutsch (automatisch übersetzt)';
              translated = de.text;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: `> 🌐 **Automatic translation: ${label}**\n\n${translated}\n\n${MARKER}`,
            });